<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Handwriting">
<meta name="theme-color" content="#E7F3EF">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Aveer’s Handwriting</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Andika:wght@400;700&display=swap">
<style>
/* Layout: a primary-school exercise book — lined paper pad as the hero, lesson cards like a copybook index. */
:root {
  --bg: #E7F3EF;
  --card: #FFFFFF;
  --ink: #15304A;
  --muted: #557086;
  --line: #CFE2DC;
  --teal: #0E7C86;
  --teal-soft: #DDF1F0;
  --on-teal: #FFFFFF;
  --pencil: #F5B700;
  --pencil-soft: #FFF2C6;
  --good: #1F9254;
  --good-soft: #DDF4E6;
  --bad: #D64545;
  --bad-soft: #FCE3E3;
  --paper: #FFFFFF;
  --rule: #8DB8E3;
  --rule-base: #4F86C6;
  --margin: #EE8C8C;
  --dots: #B9C6D3;
  --pen: #1E4FD1;
  --demo: #F08A00;
  --guide: #19A35B;
  --shadow: rgba(21, 48, 74, .10);
  --scrim: rgba(12, 30, 45, .5);
  --font-display: "Baloo 2", "Trebuchet MS", "Arial Rounded MT Bold", sans-serif;
  --font-body: "Andika", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F2229; --card: #183139; --ink: #EAF6F3; --muted: #9DB9C0; --line: #2A4A52;
    --teal: #49C3C9; --teal-soft: #1C4049; --on-teal: #08262B; --pencil: #FFC94A; --pencil-soft: #3B3317;
    --good: #4FD08A; --good-soft: #173D2B; --bad: #FF8A8A; --bad-soft: #472226;
    --paper: #F9FBFC; --rule: #8DB8E3; --rule-base: #4F86C6; --margin: #EE8C8C; --dots: #B9C6D3; --pen: #1E4FD1; --demo: #F08A00; --guide: #19A35B;
    --shadow: rgba(0, 0, 0, .4); --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F2229; --card: #183139; --ink: #EAF6F3; --muted: #9DB9C0; --line: #2A4A52;
  --teal: #49C3C9; --teal-soft: #1C4049; --on-teal: #08262B; --pencil: #FFC94A; --pencil-soft: #3B3317;
  --good: #4FD08A; --good-soft: #173D2B; --bad: #FF8A8A; --bad-soft: #472226;
  --paper: #F9FBFC; --rule: #8DB8E3; --rule-base: #4F86C6; --margin: #EE8C8C; --dots: #B9C6D3; --pen: #1E4FD1; --demo: #F08A00; --guide: #19A35B;
  --shadow: rgba(0, 0, 0, .4); --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: default; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 800; margin: 0; line-height: 1.1; text-wrap: balance; }
.wrap { max-width: 1100px; margin: 0 auto; }

/* Header */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 44px; height: 44px; border-radius: 12px; background: var(--pencil); display: grid; place-items: center; font-size: 24px; transform: rotate(-6deg); flex: 0 0 auto; box-shadow: 0 3px 0 color-mix(in srgb, var(--pencil) 55%, #000); }
.brand h1 { font-size: clamp(22px, 3.6vw, 30px); white-space: nowrap; }
.nav { display: flex; gap: 6px; flex: 0 0 auto; }
.nbtn { height: 44px; padding: 0 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); font-family: var(--font-display); font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 6px; }
.nbtn[aria-current="true"] { background: var(--teal); color: var(--on-teal); border-color: var(--teal); }
.card { background: var(--card); border: 2px solid var(--line); border-radius: 22px; box-shadow: 0 6px 18px var(--shadow); }

.big-btn { min-height: 56px; padding: 0 24px; border-radius: 16px; border: 0; background: var(--teal); color: var(--on-teal); font-family: var(--font-display); font-weight: 800; font-size: 20px; box-shadow: 0 5px 0 color-mix(in srgb, var(--teal) 55%, #000); transition: transform .1s; }
.big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 color-mix(in srgb, var(--teal) 55%, #000); }
.big-btn.alt { background: var(--card); color: var(--ink); border: 2px solid var(--line); box-shadow: 0 5px 0 var(--line); }
.big-btn.small { min-height: 46px; font-size: 17px; padding: 0 16px; }

/* Home */
.hello { padding: 20px 22px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
.hello h2 { font-size: clamp(28px, 5vw, 38px); }
.hello p { margin: 6px 0 0; color: var(--muted); font-size: 18px; max-width: 48ch; line-height: 1.45; }
.save-status { display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--teal-soft); color: var(--muted); }
.save-status.ok { background: var(--good-soft); color: var(--good); }
.save-status.warn { background: var(--bad-soft); color: var(--bad); }
.lessons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding-bottom: 40px; }
.lesson { padding: 16px; display: grid; gap: 12px; min-width: 0; }
.lesson.next { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft), 0 6px 18px var(--shadow); }
.lesson-head { display: flex; align-items: center; gap: 12px; }
.lesson-icon { width: 48px; height: 48px; border-radius: 14px; background: var(--teal-soft); display: grid; place-items: center; font-size: 26px; flex: 0 0 auto; }
.lesson-head h3 { font-size: 21px; }
.lesson-head .meta { color: var(--muted); font-size: 14px; font-weight: 700; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--teal); color: var(--on-teal); margin-left: 6px; vertical-align: middle; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-width: 44px; height: 50px; padding: 0 8px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); font-family: var(--font-body); font-size: 26px; line-height: 1; display: grid; place-items: center; position: relative; }
.chip.word { font-size: 19px; }
.chip i { position: absolute; left: 6px; right: 6px; bottom: 3px; height: 4px; border-radius: 4px; background: var(--line); }
.chip.s1 i { background: var(--bad); } .chip.s2 i { background: var(--pencil); } .chip.s3 i { background: var(--good); }
.lesson-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.starbar { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--muted); font-size: 15px; }
.starbar .bar { width: 120px; height: 10px; border-radius: 999px; background: var(--teal-soft); overflow: hidden; }
.starbar .bar b { display: block; height: 100%; background: var(--pencil); border-radius: 999px; }

/* Practice */
#vPractice { display: flex; flex-direction: column; gap: 10px; height: calc(100dvh - 66px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 520px; padding-bottom: 10px; }
.pbar { display: flex; align-items: center; gap: 10px; }
.xbtn { width: 46px; height: 46px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); font-size: 18px; flex: 0 0 auto; }
.ptitle { display: grid; min-width: 0; }
.ptitle b { font-family: var(--font-display); font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ptitle span { color: var(--muted); font-size: 14px; font-weight: 700; }
.steps { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.step { padding: 6px 12px; border-radius: 999px; background: var(--card); border: 2px solid var(--line); font-weight: 700; font-size: 14px; white-space: nowrap; color: var(--muted); }
.step.done { background: var(--good-soft); border-color: transparent; color: var(--good); }
.step.now { background: var(--teal); border-color: var(--teal); color: var(--on-teal); }
.pgrid { flex: 1; min-height: 0; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 12px; }
.model { padding: 12px; display: flex; flex-direction: column; gap: 10px; align-items: stretch; min-width: 0; }
.model-box { background: var(--paper); border-radius: 14px; border: 2px solid var(--line); aspect-ratio: 4 / 3; position: relative; overflow: hidden; max-width: 100%; }
.model-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.model-word { font-family: var(--font-display); font-weight: 700; font-size: 20px; text-align: center; }
.model-word .em { font-size: 30px; display: block; line-height: 1.2; }
.hear { height: 46px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); font-weight: 700; font-size: 16px; }
.model-tip { color: var(--muted); font-size: 14px; line-height: 1.4; text-align: center; margin: 0; }
.pad { position: relative; padding: 0; overflow: hidden; background: var(--paper); min-width: 0; touch-action: none; }
.pad canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.bubble { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-weight: 700; font-size: 16px; white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 2; }
.bubble.show { opacity: 1; }
.result { position: absolute; inset: 0; display: grid; place-items: end center; z-index: 3; padding: 12px; pointer-events: none; }
.res-card { pointer-events: auto; background: var(--card); border: 2px solid var(--line); border-radius: 22px; box-shadow: 0 12px 30px var(--shadow); padding: 14px 18px; width: min(460px, 100%); display: grid; gap: 8px; justify-items: center; text-align: center; }
.res-stars { font-size: 40px; letter-spacing: 6px; line-height: 1; color: var(--pencil); }
.res-stars .off { color: var(--line); }
.res-title { font-family: var(--font-display); font-weight: 800; font-size: 25px; }
.res-hints { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; color: var(--muted); font-size: 16px; line-height: 1.4; }
.res-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
.pctrl { display: flex; gap: 10px; justify-content: space-between; align-items: center; }
.pctrl .grp { display: flex; gap: 10px; }
.tool { height: 56px; padding: 0 16px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 6px; }
.tool .ic { font-size: 20px; }
#doneBtn { min-width: 170px; }

/* Summary + progress */
.sum-hero { padding: 24px; display: grid; gap: 14px; justify-items: center; text-align: center; margin-bottom: 16px; }
.sum-hero .chip-l { padding: 4px 12px; border-radius: 999px; background: var(--teal-soft); color: var(--teal); font-weight: 700; font-size: 14px; }
.sum-msg { font-family: var(--font-display); font-weight: 800; font-size: 30px; }
.sum-stars { font-family: var(--font-display); font-weight: 800; font-size: clamp(56px, 12vw, 84px); line-height: 1; font-variant-numeric: tabular-nums; }
.sum-stars small { font-size: .42em; color: var(--muted); }
.facts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.facts span { padding: 6px 12px; border-radius: 999px; background: var(--teal-soft); font-weight: 700; font-size: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.section { padding: 18px 20px; margin-bottom: 16px; }
.section h3 { font-size: 22px; margin-bottom: 12px; }
.notes ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 9px; }
.notes li { display: flex; gap: 10px; align-items: flex-start; line-height: 1.45; }
.dot { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.dot.up { background: var(--good-soft); color: var(--good); } .dot.down { background: var(--bad-soft); color: var(--bad); } .dot.flat { background: var(--teal-soft); color: var(--teal); }
.rows { display: grid; gap: 8px; }
.irow { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 14px; border: 2px solid var(--line); }
.irow .g { font-size: 34px; text-align: center; line-height: 1; }
.irow .g.word { font-size: 22px; }
.irow .d { color: var(--muted); font-size: 15px; line-height: 1.35; min-width: 0; }
.irow .st { font-size: 22px; letter-spacing: 2px; color: var(--pencil); white-space: nowrap; }
.st .off, .stars .off { color: var(--line); }
.stars { color: var(--pencil); letter-spacing: 2px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { padding: 14px 16px; }
.tile .k { color: var(--muted); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; }
.tile .v { font-family: var(--font-display); font-weight: 800; font-size: 32px; font-variant-numeric: tabular-nums; }
.grid-h { color: var(--muted); font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: .6px; margin: 12px 0 8px; }
.chart-box svg { display: block; width: 100%; }
.chart-box text { fill: var(--muted); font-family: var(--font-body); font-weight: 700; font-size: 12px; }
.tblwrap { overflow-x: auto; }
.hist { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
.hist th { text-align: left; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; padding: 6px 8px; border-bottom: 2px solid var(--line); }
.hist td { padding: 8px; border-bottom: 1px solid var(--line); }
.empty { text-align: center; color: var(--muted); padding: 24px 10px; font-size: 17px; line-height: 1.5; }
.empty b { display: block; font-family: var(--font-display); color: var(--ink); font-size: 24px; }
.parent p { margin: 0 0 10px; color: var(--muted); line-height: 1.45; max-width: 62ch; }
.prow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.code-box { width: 100%; min-height: 80px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); font: 13px/1.4 ui-monospace, Menlo, monospace; padding: 10px; margin-top: 10px; }
.msg { font-weight: 700; color: var(--good); margin-top: 8px; min-height: 1em; }
.danger { background: var(--card); color: var(--bad); border: 2px solid var(--bad); height: 46px; border-radius: 14px; padding: 0 16px; font-weight: 700; }
.danger[data-armed="true"] { background: var(--bad); color: var(--card); }

.modal { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 20; padding: 16px; }
.modal .card { max-width: 440px; width: 100%; padding: 22px; text-align: center; display: grid; gap: 14px; }
.modal p { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.45; }
.modal .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; width: 100%; height: 100%; }

@media (max-aspect-ratio: 1/1) {
  .pgrid { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .model { flex-direction: row; align-items: center; padding: 10px; }
  .model-box { width: 150px; flex: 0 0 auto; }
  .model-side { display: grid; gap: 8px; flex: 1; min-width: 0; }
  .model-word { text-align: left; }
  .model-word .em { display: inline; margin-right: 6px; }
  .model-tip { text-align: left; }
}
@media (max-width: 760px) {
  .lessons { grid-template-columns: minmax(0, 1fr); }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .nbtn .lb { display: none; }
  .steps .step .lb { display: none; }
  .tool .lb { display: none; }
  .tool { width: 56px; justify-content: center; padding: 0; }
  #doneBtn { min-width: 0; flex: 1; }
  .pctrl .grp:last-child { flex: 1; justify-content: flex-end; }
  .model-tip { display: none; }
  .model-box { width: 120px; }
}
@media (max-width: 480px) {
  .brand h1 { font-size: 20px; }
  .steps { flex-wrap: nowrap; gap: 4px; }
  .step { padding: 4px 8px; }
  .ptitle b { font-size: 17px; }
  .irow { grid-template-columns: 54px minmax(0, 1fr); }
  .irow .st { grid-column: 2; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="brand-mark" aria-hidden="true">✏️</div><h1>Aveer’s Handwriting</h1></div>
    <nav class="nav" id="nav">
      <button class="nbtn" id="navHome" aria-current="true"><span aria-hidden="true">📒</span><span class="lb">Lessons</span></button>
      <button class="nbtn" id="navProgress" aria-current="false"><span aria-hidden="true">📈</span><span class="lb">Progress</span></button>
      <button class="nbtn" id="navSound" aria-label="Sound on"><span class="ic" aria-hidden="true">🔊</span></button>
    </nav>
  </header>
  <main>
    <section id="vHome"></section>
    <section id="vPractice" hidden>
      <div class="pbar">
        <button class="xbtn" id="quitBtn" aria-label="Stop practice">✕</button>
        <div class="ptitle"><b id="pTitle"></b><span id="pCount"></span></div>
        <div class="steps" id="steps"></div>
      </div>
      <div class="pgrid">
        <aside class="card model">
          <div class="model-box"><canvas id="modelC" aria-label="How to write it, with stroke numbers"></canvas></div>
          <div class="model-side">
            <div class="model-word" id="modelWord"></div>
            <button class="hear" id="hearBtn">🔈 Hear it</button>
            <p class="model-tip" id="modelTip"></p>
          </div>
        </aside>
        <div class="card pad" id="pad">
          <canvas id="bgC"></canvas>
          <canvas id="inkC" aria-label="Writing paper"></canvas>
          <div class="bubble" id="bubble" role="status"></div>
          <div class="result" id="result" hidden></div>
        </div>
      </div>
      <div class="pctrl">
        <div class="grp">
          <button class="tool" id="watchBtn"><span class="ic">▶️</span><span class="lb">Watch</span></button>
          <button class="tool" id="clearBtn"><span class="ic">↺</span><span class="lb">Clear</span></button>
        </div>
        <div class="grp"><button class="big-btn" id="doneBtn">Done ✓</button></div>
      </div>
    </section>
    <section id="vSummary" hidden></section>
    <section id="vProgress" hidden></section>
  </main>
</div>
<div class="modal" id="modal" hidden><div class="card" role="dialog" aria-modal="true" id="modalCard"></div></div>
<canvas id="confetti" hidden></canvas>

<script>
(() => {
  'use strict';
  // Print (ball-and-stick) letter shapes on 4-line paper.
// Units: top line y=0, dashed midline y=50, baseline y=100, descender line y=145.
// Each glyph: w = advance width, s = strokes in teaching order.
// A stroke is a list of parts: ['line',x1,y1,x2,y2] | ['arc',cx,cy,rx,ry,a0,a1] | ['dot',x,y]
// Arc angles are in degrees, 0 = 3 o'clock, 90 = 12 o'clock; going up in angle = anticlockwise.
const GLYPHS = {
  // ---------- lowercase ----------
  a: { w: 50, s: [[['arc', 25, 75, 25, 25, 30, 390]], [['line', 50, 50, 50, 100]]] },
  b: { w: 50, s: [[['line', 0, 0, 0, 100]], [['arc', 25, 75, 25, 25, 180, -180]]] },
  c: { w: 48, s: [[['arc', 25, 75, 25, 25, 40, 320]]] },
  d: { w: 50, s: [[['arc', 25, 75, 25, 25, 30, 390]], [['line', 50, 0, 50, 100]]] },

// Turn a glyph's strokes into point lists (units), about 1.5 units apart.
function samplePart(p) {
  const out = [];
  if (p[0] === 'dot') { out.push([p[1], p[2]]); return out; }
  if (p[0] === 'line') {
    const [, x1, y1, x2, y2] = p, L = Math.hypot(x2 - x1, y2 - y1), n = Math.max(1, Math.ceil(L / 1.5));
    for (let i = 0; i <= n; i++) out.push([x1 + (x2 - x1) * i / n, y1 + (y2 - y1) * i / n]);
    return out;
  }
  const [, cx, cy, rx, ry, a0, a1] = p, span = Math.abs(a1 - a0) * Math.PI / 180;
  const n = Math.max(2, Math.ceil(span * Math.max(rx, ry) / 1.5));
  for (let i = 0; i <= n; i++) {
    const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180;
    out.push([cx + rx * Math.cos(a), cy - ry * Math.sin(a)]);
  }

}

    if (!last || Math.hypot(q[0] - last[0], q[1] - last[1]) > 0.01) pts.push(q);
  }));
  return pts;
}

    P.mode = 'watch'; P.returnTo = keep; P.ink = []; P.cur = null; P.result = null; P.overlay = null; P.watchDone = false; $('result').hidden = true; hideBubble();
    drawBg(); updateControls(); playWatch();
  };
  $('hearBtn').onclick = () => { unlockAudio(); if (S) speak(sayFor(S.items[S.idx])); };
  $('quitBtn').onclick = () => {
    const any = S && Object.values(S.res).some(r => r.trace.length || r.write.length);
    modal(`<h3>Stop practising?</h3><p>${any ? 'Your stars so far are saved.' : 'You can come back any time.'}</p><div class="row"><button class="big-btn alt" data-m="close">Keep going</button><button class="big-btn" data-m="quit">Stop</button></div>`);
  };
  new ResizeObserver(() => { if (view === 'practice' && S) { layout(); drawBg(); if (P.mode !== 'watch' || P.watchDone) drawInk(); renderModel(); } }).observe(padEl);

  // ================= Lesson summary =================
  function recordSession() {
    const items = Object.entries(S.res).filter(([, r]) => r.trace.length || r.write.length);
    if (!items.length) return null;
    const best = {}; items.forEach(([it, r]) => best[it] = { w: r.write.length ? Math.max(...r.write) : -1, t: r.trace.length ? Math.round(r.trace.reduce((a, b) => a + b, 0) / r.trace.length) : -1 });
    const ws = Object.values(best).map(b => b.w).filter(v => v >= 0);
    const sess = { id: S.start, l: S.L.id, single: S.single, secs: Math.round((Date.now() - S.start) / 1000), best, avg: ws.length ? Math.round(ws.reduce((a, b) => a + b, 0) / ws.length) : -1, stars: ws.reduce((s, v) => s + starsOf(v), 0) };
    mem.sessions.push(sess); save();
    return sess;
  }
  function finishLesson() {
    const prior = mem.sessions.filter(s => s.l === S.L.id && !s.single);
    const priorAttempts = mem.attempts.filter(a => a.t < S.start);
    const sess = recordSession(); S = null;
    if (!sess) { renderHome(); show('home'); return; }
    renderSummary(sess, prior, priorAttempts); show('summary'); sfx.done();
    if (sess.stars >= Object.keys(sess.best).length * 2) confetti();
  }
  function renderSummary(sess, prior, priorAttempts) {
    const L = LESSONS.find(l => l.id === sess.l), items = Object.keys(sess.best), max = items.length * 3;
    const pct = sess.stars / max;
    const msg = pct >= .9 ? 'Amazing writing, Aveer! 🌟' : pct >= .66 ? 'Great work, Aveer! 🎉' : pct >= .4 ? 'Good practice, Aveer! 👍' : 'Keep practising, Aveer! 💪';
    const notes = [];
    const last = prior[prior.length - 1];
    if (sess.single) notes.push(['flat', `Extra practice on ${items[0]}.`]);
    else if (last) { const d = sess.stars - last.stars; notes.push([d > 0 ? 'up' : d < 0 ? 'down' : 'flat', d > 0 ? `<b>${plural(d, 'more star')}</b> than last time on this lesson (${last.stars} → ${sess.stars}).` : d < 0 ? `${plural(-d, 'star')} fewer than last time (${last.stars} → ${sess.stars}). Writing changes from day to day, so keep practising!` : `The same stars as last time (${sess.stars}).`]); }
    else notes.push(['flat', 'First time doing this lesson. These stars are the starting point for next time.']);
    const neater = items.filter(it => { const before = priorAttempts.filter(a => a.i === it && a.m === 'write'); if (!before.length) return false; const prevBest = Math.max(...before.map(a => a.s)); return sess.best[it].w >= prevBest + 6; });
    if (neater.length) notes.push(['up', `Neater than ever before: <b>${neater.join(', ')}</b>.`]);
    const neat = items.filter(it => sess.best[it].w >= 86);
    if (neat.length && !neater.length) notes.push(['up', `Very neat today: <b>${neat.slice(0, 6).join(', ')}</b>.`]);
    const weak = items.filter(it => sess.best[it].w >= 0 && sess.best[it].w < 72);
    if (weak.length) notes.push(['down', `Practise again: <b>${weak.join(', ')}</b>. Tap a letter on the Lessons page to practise just that one.`]);
    const rows = items.map(it => {
      const b = sess.best[it], ws = starsOf(b.w), ever = bestWrite(it);
      return `<div class="irow"><div class="g ${it.length > 1 ? 'word' : ''}">${it}</div><div class="d">Written by himself: ${b.w >= 0 ? b.w + '%' : 'not done'} · Tracing: ${b.t >= 0 ? b.t + '%' : '–'}${ever > b.w ? ` · Best ever ${ever}%` : ''}</div><div class="st" aria-label="${ws} stars">${starHTML(b.w >= 0 ? ws : 0)}</div></div>`;
    }).join('');
    const nl = LESSONS.indexOf(L) + 1 < LESSONS.length ? LESSONS[LESSONS.indexOf(L) + 1] : null;
    $('vSummary').innerHTML = `
      <div class="card sum-hero">
        <span class="chip-l">${L.icon} ${L.name}</span>
        <div class="sum-msg">${msg}</div>
        <div class="sum-stars">${sess.stars}<small> / ${max} ★</small></div>
        <div class="facts"><span>${plural(items.length, items[0].length > 1 ? 'word' : 'letter')}</span><span>⏱ ${fmtSecs(sess.secs)}</span>${sess.avg >= 0 ? `<span>Neatness ${sess.avg}%</span>` : ''}</div>
        <div class="actions">${nl && !sess.single ? `<button class="big-btn" id="goNext">${nl.name} →</button>` : ''}<button class="big-btn ${nl && !sess.single ? 'alt' : ''}" id="again">Practise again</button><button class="big-btn alt" id="toProg">See progress</button></div>
      </div>
      <div class="card section notes"><h3>How Aveer is doing</h3><ul>${notes.map(([k, t]) => `<li><span class="dot ${k}">${k === 'up' ? '↑' : k === 'down' ? '!' : '•'}</span><span>${t}</span></li>`).join('')}</ul></div>
      <div class="card section"><h3>Today’s writing</h3><div class="rows">${rows}</div></div>`;
    if ($('goNext')) $('goNext').onclick = () => { unlockAudio(); startLesson(nl.id); };
    $('again').onclick = () => { unlockAudio(); sess.single ? startLesson(L.id, items[0]) : startLesson(L.id); };
    $('toProg').onclick = () => { renderProgress(); show('progress'); };
  }

  // ================= Progress =================
  function renderProgress() {
    const tried = ALL_ITEMS.filter(it => bestWrite(it) >= 0), neat = ALL_ITEMS.filter(it => bestWrite(it) >= 86);
    const totalStars = LESSONS.reduce((s, L) => s + lessonStars(L), 0);
    const sess = mem.sessions;
    let html = `<div class="tiles">
      <div class="card tile"><div class="k">Days practised</div><div class="v">${daysPractised()}</div></div>
      <div class="card tile"><div class="k">Letters &amp; words tried</div><div class="v">${tried.length}<small style="font-size:.5em;color:var(--muted)"> / ${ALL_ITEMS.length}</small></div></div>
      <div class="card tile"><div class="k">Super neat ★★★</div><div class="v">${neat.length}</div></div>
      <div class="card tile"><div class="k">Stars</div><div class="v">${totalStars}</div></div></div>`;
    if (!sess.length) {
      html += `<div class="card section"><div class="empty"><b>No practice yet</b>Finish a lesson and Aveer’s stars, neatest letters and progress will show here.</div></div>`;
    } else {
      const notes = [];
      if (sess.length >= 4) {
        const h = Math.floor(sess.length / 2), a = sess.slice(0, h).filter(s => s.avg >= 0), b = sess.slice(-h).filter(s => s.avg >= 0);
        if (a.length && b.length) {
          const f = Math.round(a.reduce((s, x) => s + x.avg, 0) / a.length), l = Math.round(b.reduce((s, x) => s + x.avg, 0) / b.length);
          notes.push([l - f > 3 ? 'up' : l - f < -3 ? 'down' : 'flat', `Neatness moved from <b>${f}%</b> in the first ${plural(h, 'practice', 'practices')} to <b>${l}%</b> in the latest ${plural(h, 'practice', 'practices')}${l - f > 3 ? '. His writing is getting neater!' : l - f < -3 ? ', partly because later lessons are harder.' : '.'}`]);
        }
      } else notes.push(['flat', `${plural(sess.length, 'practice', 'practices')} so far. Trends show after a few more.`]);
      const improved = tried.filter(it => { const w = writesOf(it); return w.length >= 2 && w[w.length - 1].s - w[0].s >= 12; });
      if (improved.length) notes.push(['up', `Getting neater: <b>${improved.slice(0, 8).join(', ')}</b>.`]);
      if (neat.length) notes.push(['up', `Super neat: <b>${neat.slice(0, 12).join(', ')}</b>${neat.length > 12 ? ` and ${neat.length - 12} more` : ''}.`]);
      const weak = tried.filter(it => bestWrite(it) < 72).sort((a, b) => bestWrite(a) - bestWrite(b));
      if (weak.length) notes.push(['down', `Needs more practice: <b>${weak.slice(0, 8).join(', ')}</b>. Tap one below to practise it.`]);
      const untried = LESSONS.filter(L => !L.items.some(it => bestWrite(it) >= 0));
      if (untried.length) notes.push(['flat', `Not started yet: ${untried.map(L => L.name).slice(0, 4).join(', ')}.`]);
      const st = streak(); if (st > 1) notes.push(['up', `${st} days in a row!`]);
      html += `<div class="card section notes"><h3>Progress notes</h3><ul>${notes.map(([k, t]) => `<li><span class="dot ${k}">${k === 'up' ? '↑' : k === 'down' ? '!' : '•'}</span><span>${t}</span></li>`).join('')}</ul></div>`;
      html += `<div class="card section"><h3>Neatness over time</h3><div class="chart-box" id="chart"></div><p style="color:var(--muted);margin:8px 0 0;font-size:14px">Each dot is one practice: how neatly he wrote on his own (traced letters not counted).</p></div>`;
    }
    const group = (title, items) => `<div class="grid-h">${title}</div><div class="chips">${items.map(it => chipHTML(it)).join('')}</div>`;
    html += `<div class="card section"><h3>All letters</h3><p style="color:var(--muted);margin:0 0 4px">Green = super neat, yellow = good, red = needs practice. Tap any one to practise it.</p>
      ${group('Capitals', LESSONS.slice(0, 3).flatMap(l => l.items).sort())}${group('Small letters', LESSONS.slice(3, 7).flatMap(l => l.items).sort())}${group('Numbers', LESSONS[7].items)}${group('Words', [...LESSONS[8].items, ...LESSONS[9].items])}</div>`;
    if (sess.length) {
      html += `<div class="card section"><h3>All practice</h3><div class="tblwrap"><table class="hist"><thead><tr><th>When</th><th>Lesson</th><th>Stars</th><th>Neatness</th><th>Time</th></tr></thead><tbody>${sess.slice().reverse().slice(0, 60).map(s => { const L = LESSONS.find(l => l.id === s.l); const n = Object.keys(s.best).length; return `<tr><td>${fmtDate(s.id)}</td><td>${s.single ? 'Extra: ' + Object.keys(s.best)[0] : L ? L.name : s.l}</td><td>${s.stars} / ${n * 3}</td><td>${s.avg >= 0 ? s.avg + '%' : '–'}</td><td>${fmtSecs(s.secs)}</td></tr>`; }).join('')}</tbody></table></div></div>`;
    }
    html += `<div class="card section parent"><h3>For parents</h3>${statusHTML()}
      <p style="margin-top:10px">${keeping() ? 'Progress is saved in this browser on this device. Open the app from its Home Screen icon so Safari keeps it.' : '<b>This window is not keeping progress.</b> Open the app’s own link in Safari and add it to the Home Screen.'} Use a backup code to move progress to another device or keep it safe.</p>
      <div class="prow"><button class="big-btn alt small" id="copyBackup">Copy backup code</button><button class="big-btn alt small" id="showRestore">Restore from a code</button><button class="danger" id="resetBtn" data-armed="false">Reset all progress</button></div>
      <textarea id="backupText" class="code-box" readonly hidden aria-label="Backup code"></textarea>
      <div id="restoreBox" hidden><textarea id="restoreText" class="code-box" placeholder="Paste the backup code here" aria-label="Paste backup code"></textarea><button class="big-btn small" id="doRestore" style="margin-top:8px">Restore progress</button></div>
      <p class="msg" id="backupMsg" role="status"></p></div>`;
    $('vProgress').innerHTML = `<div style="padding-bottom:40px">${html}</div>`;
    drawChart();
    $('vProgress').querySelectorAll('[data-item]').forEach(b => b.onclick = () => { unlockAudio(); startLesson(lessonOf(b.dataset.item).id, b.dataset.item); });
    wireParent();
  }
  function drawChart() {
    const box = $('chart'); if (!box) return;
    const A = mem.sessions.filter(s => s.avg >= 0).slice(-30);
    if (!A.length) { box.innerHTML = '<p class="empty">No written letters yet.</p>'; return; }
    const W = Math.max(280, box.clientWidth), H = 220, pl = 40, pr = 16, pt = 14, pb = 30;
    const x = i => A.length === 1 ? pl + (W - pl - pr) / 2 : pl + i * (W - pl - pr) / (A.length - 1);
    const y = v => pt + (1 - v / 100) * (H - pt - pb);
    let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Neatness over time">`;
    [0, 50, 100].forEach(v => s += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${v}%</text>`);
    s += `<line x1="${pl}" x2="${W - pr}" y1="${y(86)}" y2="${y(86)}" stroke="var(--good)" stroke-dasharray="6 5" opacity=".8"/><text x="${pl + 6}" y="${y(86) - 6}">★★★ super neat</text>`;
    if (A.length > 1) {
      const pts = A.map((a, i) => `${x(i)},${y(a.avg)}`).join(' ');
      s += `<polygon points="${pl},${y(0)} ${pts} ${x(A.length - 1)},${y(0)}" fill="var(--teal)" opacity=".12"/><polyline points="${pts}" fill="none" stroke="var(--teal)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
    A.forEach((a, i) => { s += `<circle cx="${x(i)}" cy="${y(a.avg)}" r="${i === A.length - 1 ? 7 : 4.5}" fill="var(--teal)" stroke="var(--card)" stroke-width="2"><title>${fmtDate(a.id)}: ${a.avg}%</title></circle>`; });
    const L = A[A.length - 1];
    s += `<text x="${Math.min(x(A.length - 1), W - pr - 14)}" y="${L.avg > 90 ? y(L.avg) + 22 : y(L.avg) - 12}" text-anchor="middle" style="fill:var(--ink);font-size:13px">${L.avg}%</text>`;
    box.innerHTML = s + '</svg>';
  }
  function merge(a, b) {
    const resetAt = Math.max(a.resetAt || 0, b.resetAt || 0), at = new Map(), ss = new Map();
    [...(a.attempts || []), ...(b.attempts || [])].forEach(x => { if (x && x.t > resetAt) at.set(x.t + '|' + x.i + '|' + x.m, x); });
    [...(a.sessions || []), ...(b.sessions || [])].forEach(x => { if (x && x.id > resetAt) ss.set(x.id, x); });
    return { attempts: [...at.values()].sort((p, q) => p.t - q.t), sessions: [...ss.values()].sort((p, q) => p.id - q.id), resetAt };
  }
  function wireParent() {
    const msg = t => { $('backupMsg').textContent = t; };
    $('copyBackup').onclick = async () => {
      const code = 'AVEER-HW1:' + btoa(unescape(encodeURIComponent(JSON.stringify({ attempts: mem.attempts, sessions: mem.sessions, resetAt: mem.resetAt || 0 }))));
      const box = $('backupText'); box.value = code;
      try { await navigator.clipboard.writeText(code); box.hidden = true; msg(`Backup code copied (${plural(mem.sessions.length, 'practice', 'practices')}). Paste it into Notes to keep it safe.`); }
      catch (_) { box.hidden = false; box.focus(); box.select(); msg('Copy the selected code and keep it in Notes.'); }
    };
    $('showRestore').onclick = () => { $('restoreBox').hidden = false; $('restoreText').focus(); };
    $('doRestore').onclick = () => {
      const raw = $('restoreText').value.trim();
      try {
        if (!raw.startsWith('AVEER-HW1:')) throw 0;
        const data = JSON.parse(decodeURIComponent(escape(atob(raw.slice(10)))));
        if (!Array.isArray(data.attempts)) throw 0;
        const before = mem.sessions.length;
        Object.assign(mem, merge(mem, data)); save(); renderProgress();
        $('backupMsg').textContent = `Restored. ${plural(mem.sessions.length - before, 'practice', 'practices')} added back.`;
      } catch (_) { msg('That code did not work. Copy the whole code, starting with AVEER-HW1:'); }
    };
    const r = $('resetBtn');
    r.onclick = () => {
      if (r.dataset.armed !== 'true') { r.dataset.armed = 'true'; r.textContent = 'Tap again to delete all progress'; return; }
      mem.attempts = []; mem.sessions = []; mem.resetAt = Date.now(); save(); renderProgress();
    };
  }

  // ================= Modal, confetti, nav =================
  function modal(html) {
    $('modalCard').innerHTML = html; $('modal').hidden = false;
    $('modalCard').querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
      $('modal').hidden = true;
      if (b.dataset.m === 'quit') { cancelAnimationFrame(P.anim); clearTimeout(P.autoTimer); if (S) recordSession(); S = null; renderHome(); show('home'); }
    });
  }
  function confetti() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = $('confetti'), x = c.getContext('2d'); c.hidden = false; c.width = innerWidth; c.height = innerHeight;
    const cols = ['#0E7C86', '#F5B700', '#1F9254', '#E53935', '#1E88E5', '#F06292'];
    const ps = Array.from({ length: 140 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, r: Math.random() * 6, s: 6 + Math.random() * 7, c: cols[(Math.random() * cols.length) | 0] }));
    const t0 = performance.now();
    (function f(now) {
      x.clearRect(0, 0, c.width, c.height);
      ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += .1; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
      if (now - t0 < 2600) requestAnimationFrame(f); else { x.clearRect(0, 0, c.width, c.height); c.hidden = true; }
    })(t0);
  }
  $('navHome').onclick = () => { unlockAudio(); renderHome(); show('home'); };
  $('navProgress').onclick = () => { unlockAudio(); renderProgress(); show('progress'); };
  const syncSound = () => { $('navSound').querySelector('.ic').textContent = mem.sound ? '🔊' : '🔇'; $('navSound').setAttribute('aria-label', mem.sound ? 'Sound on' : 'Sound off'); };
  $('navSound').onclick = () => { mem.sound = !mem.sound; save(); syncSound(); unlockAudio(); sfx.tap(); if (!mem.sound && canSpeak) speechSynthesis.cancel(); };
  syncSound();
  window.addEventListener('resize', () => { if (view === 'progress') drawChart(); });
  if (canSpeak) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch (_) {} }

  renderHome(); show('home');
  window.__hw = { layoutItem, P, S: () => S, toPx, check, GLYPHS };
})();
</script>
